name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout production source
        uses: actions/checkout@v5
        with:
          ref: main
          path: production-source

      - name: Checkout development source
        uses: actions/checkout@v5
        with:
          ref: development
          path: development-source

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install production dependencies
        run: npm install --prefix production-source

      - name: Install development dependencies
        run: npm install --prefix development-source

      - name: Build production version
        env:
          DEPLOY_BASE: /Einmaleins/
          BUILD_COMMIT: ${{ github.sha }}
        run: npm --prefix production-source run build

      - name: Build development version
        env:
          DEPLOY_BASE: /Einmaleins/test/
          BUILD_COMMIT: ${{ github.sha }}
        run: npm --prefix development-source run build

      - name: Assemble Pages site
        run: |
          rm -rf site
          mkdir -p site/test
          cp -R production-source/dist/. site/
          cp -R development-source/dist/. site/test/
          printf '{"productionCommit":"%s","developmentCommit":"%s"}\n' \
            "$(git -C production-source rev-parse HEAD)" \
            "$(git -C development-source rev-parse HEAD)" > site/deployment-info.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
