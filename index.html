<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e9f7ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Einmaleins" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./einmaleins-icon.svg" />
    <link rel="stylesheet" href="./src/responsive.css" />
    <link rel="stylesheet" href="./src/laptop.css" />
    <link rel="stylesheet" href="./space-theme.css" />
    <title>Einmaleins</title>
  </head>

  <body>
    <div id="app"></div>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js?v=16", { scope: "./", updateViaCache: "none" })
            .then((registration) => registration.update())
            .catch(() => {
              // The app remains fully usable when service workers are unavailable.
            });
        });
      }
    </script>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
