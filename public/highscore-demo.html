<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#e9f7ff">
  <title>Einmaleins – Highscore-Demo</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#e9f7ff;font-synthesis:none;text-rendering:optimizeLegibility}
    *{box-sizing:border-box}
    html{min-width:320px;background:#e9f7ff;scroll-behavior:smooth}
    body{min-width:320px;min-height:100vh;margin:0;background-color:#e9f7ff;background-image:url("./Background.png");background-position:center;background-size:cover;background-repeat:no-repeat;background-attachment:fixed;color:#52afe7;overscroll-behavior-y:none;touch-action:pan-y}
    button{font:inherit}
    main{width:min(100%,980px);min-height:100vh;margin:0 auto;padding:20px 24px 36px;display:block;position:relative}
    main::after{content:"";position:fixed;left:-4vw;bottom:3vh;width:24vw;height:24vw;background:url("./Alien.png") center / contain no-repeat;z-index:9999;pointer-events:none}
    .card{position:relative;width:100%;min-height:92vh;padding:30px 34px 30px;text-align:center;border:1px solid rgb(23 32 51 / 7%);border-radius:32px;background:rgb(255 255 255 / 72%);box-shadow:0 18px 50px rgb(23 32 51 / 8%);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
    .content{position:relative;z-index:1}
    .brand-row{display:flex;justify-content:center;align-items:center;margin-bottom:16px}
    .eyebrow{margin:0;font-size:clamp(2rem,5vw,3.7rem);font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#52afe7;line-height:1}
    h1{margin:10px 0 8px;font-size:clamp(2rem,5vw,3.1rem);line-height:1.05;letter-spacing:-.045em;color:#000}
    .muted{max-width:620px;margin:0 auto;color:rgb(23 32 51 / 66%);font-size:1.02rem;line-height:1.5}
    .timer{max-width:760px;margin:20px auto 0;padding:11px 15px 12px;border-radius:14px;background:rgb(255 255 255 / 58%);display:flex;justify-content:space-between;gap:20px;align-items:center;color:#52afe7;font-weight:800}.timer strong{font-size:1.05rem;color:#000}
    .bar{max-width:760px;height:5px;margin:10px auto 0;border-radius:999px;background:#dce2ea;overflow:hidden}.bar>span{display:block;height:100%;width:0;background:#52afe7;transition:width .2s linear}
    .status{margin:14px 0 0;color:#7a8495;font-size:.9rem;font-weight:750}.status.ok{color:#248f5b}
    .list-shell{width:100%;max-width:900px;margin:32px auto 0;text-align:left}
    .list-heading{margin:0 0 10px;color:#52afe7;font-size:1rem;font-weight:900;text-transform:uppercase;letter-spacing:.12em}
    .highscore-list{width:100%;border:1px solid rgb(23 32 51 / 8%);border-radius:22px;background:rgb(255 255 255 / 95%);overflow:hidden}
    .row{display:grid;grid-template-columns:78px minmax(0,1fr) 150px 180px;gap:8px;align-items:center;min-height:136px;padding:24px;border-top:1px solid rgb(23 32 51 / 8%)}.row:first-child{border-top:0}
    .row.me{background:#edf8f1}.row.rank-gold{background:#fff6d8}.row.rank-silver{background:#f0f2f5}.row.rank-bronze{background:#f7eee7}.row.rank-gold.me,.row.rank-silver.me,.row.rank-bronze.me{background:#edf8f1}
    .rank{font-size:2.15rem;font-weight:900;color:#6f798a}.rank-gold .rank{color:#9a7819}.rank-silver .rank{color:#66707d}.rank-bronze .rank{color:#96613f}
    .entry-meta{display:grid;grid-template-columns:88px minmax(0,1fr);align-items:center;gap:6px;min-width:0;transform:translateX(-1vw)}
    .mascot-slot{width:88px;height:88px;border-radius:18px;display:grid;place-items:center;border:1px solid rgb(23 32 51 / 8%);background:#f3f5f8;overflow:hidden}.mascot-slot img{width:100%;height:100%;object-fit:contain;display:block}
    .name{font-size:1.55rem;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#000}.class{display:block;margin-top:6px;color:#52afe7;font-size:1.1rem;font-weight:850}
    .achievement-stars{display:grid;grid-template-columns:repeat(3,48px);justify-content:start;gap:6px;align-items:center;width:150px;transform:translateX(calc(3vw - 24px))}.achievement-stars img{width:48px;height:48px;object-fit:contain;display:block}.achievement-stars img.is-muted{opacity:.22;filter:grayscale(1)}
    .score{text-align:right;font-size:2.15rem;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;color:#000}.row.me .score{color:#248f5b}
    .note{max-width:900px;margin:16px auto 0;padding:14px 16px;border-radius:16px;background:rgb(255 255 255 / 58%);color:rgb(23 32 51 / 68%);font-size:.96rem;text-align:left}
    button{width:min(100%,760px);min-height:58px;margin-top:16px;border:0;border-radius:16px;background:linear-gradient(145deg,#68c9f4,#52afe7);color:#fff;font-size:1.05rem;font-weight:800;cursor:pointer;touch-action:manipulation;transition:transform 100ms ease,filter 100ms ease}button:active{transform:translateY(2px) scale(.995)}button:hover{filter:brightness(1.04) saturate(1.04)}
    .highscore-exit{position:fixed;top:calc(14px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));z-index:10001;width:48px;height:48px;margin:0;padding:0;border-radius:50%;background:rgb(255 255 255 / 94%);color:#172033;border:1px solid rgb(23 32 51 / 10%);box-shadow:0 6px 16px rgb(23 32 51 / 10%);font-size:1.35rem;line-height:1;opacity:0;pointer-events:none;transform:scale(.92);transition:opacity 160ms ease,transform 160ms ease}
    .highscore-exit.visible{opacity:1;pointer-events:auto;transform:scale(1)}
    .highscore-exit:active{transform:scale(.96)}
    .highscore-anchor{height:1px}
    @media(max-width:700px){main{padding:12px 12px 28px}.card{min-height:95vh;padding:24px 12px 24px;border-radius:24px}.eyebrow{font-size:clamp(2.1rem,9vw,3.2rem)}.muted{font-size:.94rem}.list-shell{margin-top:28px}.list-heading{font-size:.84rem}.highscore-list{border-radius:18px}.row{grid-template-columns:58px minmax(0,1fr) 96px 108px;gap:6px;min-height:106px;padding:18px 14px}.rank{font-size:1.45rem}.entry-meta{grid-template-columns:62px minmax(0,1fr);gap:4px;transform:translateX(-1vw)}.mascot-slot{width:62px;height:62px;border-radius:14px}.achievement-stars{grid-template-columns:repeat(3,30px);width:96px;gap:2px;transform:translateX(calc(3vw - 16px))}.achievement-stars img{width:30px;height:30px}.name{font-size:1.12rem}.class{font-size:.9rem}.score{font-size:1.5rem}}
  </style>
</head>
<body>
<button class="highscore-exit" id="highscore-exit" type="button" aria-label="Highscoreliste verlassen" title="Highscoreliste verlassen">×</button>
<main>
  <section class="card">
    <div class="content">
      <div class="brand-row"><p class="eyebrow">Einmaleins</p></div>
      <h1>Schulweite Highscoreliste</h1>
      <p class="muted" id="intro">Eine kurze Demo simuliert Spielzeit und Übertragung.</p>
      <div class="timer"><span>Zeit</span><strong id="time">0:10</strong></div>
      <div class="bar"><span id="bar"></span></div>
      <p class="status" id="status">Testspiel läuft …</p>
      <section class="list-shell" id="list-shell" aria-labelledby="list-heading">
        <p class="list-heading" id="list-heading">Beispielrangliste</p>
        <div id="leaderboard" class="highscore-list" hidden></div>
      </section>
      <div class="note" id="note">Die Einträge sind frei erfunden. Klassentier und bis zu drei Errungenschaften werden mit den Originalbildern dargestellt.</div>
      <button id="restart" type="button">Demo erneut starten</button>
      <div class="highscore-anchor" id="highscore-anchor" aria-hidden="true"></div>
    </div>
  </section>
</main>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const hash = new URLSearchParams(location.hash.replace(/^#\??/, ""));
  let stored = null;
  try { stored = JSON.parse(localStorage.getItem("einmaleins.student.profile.v1") || "null"); } catch {}
  const get = (key, fallback = "") => params.get(key) || hash.get(key) || (stored && typeof stored[key] === "string" ? stored[key] : "") || fallback;
  const firstName = get("firstName", "Schüler");
  const lastName = get("lastName", "");
  const name = get("fullName", `${firstName}${lastName ? ` ${lastName}` : ""}`).trim();
  const studentId = get("studentId", "demo-student");
  const deviceGroups = get("deviceGroups", "");
  const classMatch = deviceGroups.split(/[,;|]/).map((x) => x.trim()).find((x) => /^(M(?:[1-9]|1[0-6])|Lehrer)$/i.test(x));
  const className = classMatch ? classMatch.toUpperCase() : (stored && typeof stored.className === "string" && stored.className ? stored.className : "M1");
  const requestedScore = Number(params.get("score"));
  const myScore = Number.isInteger(requestedScore) && requestedScore >= 0 ? requestedScore : 742;
  const CLASS_MASCOTS = Object.fromEntries(Array.from({ length: 16 }, (_, index) => [`M${index + 1}`, `./M${index + 1}.png`]));
  CLASS_MASCOTS.Lehrer = "./M1.png";
  const STAR_ASSETS = ["./Stern1.png", "./Stern2.png", "./Stern3.png"];
  const demoRows = [
    {name:"Sophie Weber",className:"M3",score:1288,stars:3},
    {name:"Lukas Hoffmann",className:"M6",score:1196,stars:2},
    {name:"Emma Schneider",className:"M1",score:1034,stars:3},
    {name:"Noah Fischer",className:"M8",score:987,stars:2},
    {name:"Mia Wagner",className:"M4",score:931,stars:1},
    {name:"Ben Müller",className:"M2",score:884,stars:2},
    {name:"Lea Becker",className:"M5",score:816,stars:1},
    {name:name,className:className,score:myScore,studentId,stars:3},
    {name:"Paul Krüger",className:"M7",score:731,stars:1}
  ];
  const timeEl=document.getElementById("time"),bar=document.getElementById("bar"),status=document.getElementById("status"),list=document.getElementById("leaderboard"),intro=document.getElementById("intro"),restart=document.getElementById("restart"),exitButton=document.getElementById("highscore-exit");
  intro.textContent=`Zehn Sekunden Spielzeit werden simuliert. Danach wird ${name} testweise mit ${myScore} Punkten übertragen.`;
  function mascotMarkup(entry){ const mascot=CLASS_MASCOTS[entry.className]; return `<span class="mascot-slot" aria-label="Klassenlogo ${escapeAttr(entry.className || "")}">${mascot ? `<img src="${escapeAttr(mascot)}" alt="Klasse ${escapeAttr(entry.className || "")}" decoding="async">` : ""}</span>`; }
  function starsMarkup(count){ return `<span class="achievement-stars" aria-label="${Math.min(count,3)} von 3 Errungenschaften">${STAR_ASSETS.map((asset,index)=>`<img src="${asset}" class="${index<count?"":"is-muted"}" alt="" decoding="async">`).join("")}</span>`; }
  let startedAt=0, timer=0;
  function start(){ window.scrollTo(0,0); startedAt=Date.now();clearInterval(timer);status.textContent="Testspiel läuft …";status.className="status";list.hidden=true;timeEl.textContent="0:10";bar.style.width="0%";exitButton.classList.remove("visible");timer=window.setInterval(()=>{const elapsed=Date.now()-startedAt;const remaining=Math.max(0,10000-elapsed);const seconds=Math.ceil(remaining/1000);timeEl.textContent=`0:${String(seconds).padStart(2,"0")}`;bar.style.width=`${Math.min(100,elapsed/10000*100)}%`;if(remaining<=0){clearInterval(timer);finish();}},50); }
  function finish(){ const sorted=[...demoRows].sort((a,b)=>b.score-a.score).map((entry,index)=>({...entry,rank:index+1}));const me=sorted.find(entry=>entry.studentId===studentId&&entry.name===name&&entry.score===myScore);status.textContent=`Übertragung simuliert · ${me?`Platz ${me.rank}`:"Eintrag übernommen"}`;status.className="status ok";list.innerHTML=sorted.map(entry=>`<div class="row ${entry.studentId===studentId?"me":""} ${entry.rank===1?"rank-gold":entry.rank===2?"rank-silver":entry.rank===3?"rank-bronze":""}"><div class="rank">${entry.rank}</div><div class="entry-meta">${mascotMarkup(entry)}<div style="min-width:0"><div class="name">${escapeHtml(entry.name)}${entry.studentId===studentId?" · Du":""}</div><span class="class">Klasse ${escapeHtml(entry.className||"–")}</span></div></div>${starsMarkup(entry.stars)}<div class="score">${entry.score}</div></div>`).join("");list.hidden=false;updateExitVisibility(); }
  function escapeHtml(value){return value.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
  function escapeAttr(value){return escapeHtml(value);}
  function updateExitVisibility(){ exitButton.classList.toggle("visible",window.scrollY > Math.max(220,window.innerHeight * .35)); }
  exitButton.addEventListener("click",()=>{window.scrollTo({top:0,behavior:"smooth"});});
  window.addEventListener("scroll",updateExitVisibility,{passive:true});
  document.addEventListener("gesturestart",event=>{if(event.cancelable)event.preventDefault();},{passive:false});
  document.addEventListener("gesturechange",event=>{if(event.cancelable)event.preventDefault();},{passive:false});
  document.addEventListener("gestureend",event=>{if(event.cancelable)event.preventDefault();},{passive:false});
  restart.addEventListener("click",start);
  start();
})();
</script>
</body>
</html>
