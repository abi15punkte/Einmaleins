<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#e9f7ff">
<title>Einmaleins – Highscore-Demo</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#e9f7ff}*{box-sizing:border-box}html{min-width:320px;background:#e9f7ff;scroll-behavior:smooth}body{min-width:320px;min-height:100vh;margin:0;background:#e9f7ff url("./Background.png") center/cover fixed no-repeat;color:#52afe7;overscroll-behavior-y:none;touch-action:pan-y}main{width:min(100%,980px);min-height:100vh;margin:auto;padding:20px 24px 36px;position:relative}main:after{content:"";position:fixed;left:-4vw;bottom:3vh;width:24vw;height:24vw;background:url("./Alien.png") center/contain no-repeat;z-index:9999;pointer-events:none}.card{width:100%;min-height:92vh;padding:30px 34px;text-align:center;border-radius:32px;background:#ffffffb8;box-shadow:0 18px 50px #17203314;backdrop-filter:blur(7px)}.brand-row{margin-bottom:16px}.eyebrow{margin:0;color:#52afe7;font-size:clamp(2rem,5vw,3.7rem);font-weight:900;letter-spacing:.08em;text-transform:uppercase}h1{margin:10px 0 8px;color:#000;font-size:clamp(2rem,5vw,3.1rem)}.muted{max-width:620px;margin:auto;color:#172033a8}.timer,.bar,.status,.list-shell,.note{max-width:900px;margin-left:auto;margin-right:auto}.timer{margin-top:20px;padding:11px 15px;border-radius:14px;background:#ffffff94;display:flex;justify-content:space-between;color:#52afe7;font-weight:800}.timer strong{color:#000}.bar{height:5px;margin-top:10px;border-radius:999px;background:#dce2ea;overflow:hidden}.bar span{display:block;height:100%;width:0;background:#52afe7}.status{margin-top:14px;color:#7a8495}.status.ok{color:#248f5b}.list-shell{margin-top:32px;text-align:left}.list-heading{margin:0 0 10px;color:#52afe7;font-weight:900;text-transform:uppercase;letter-spacing:.12em}.highscore-list{width:100%;border-radius:22px;background:#fffffff2;overflow:hidden}.row{display:grid;grid-template-columns:78px minmax(0,1fr) 150px 180px;gap:8px;align-items:center;min-height:136px;padding:24px;border-top:1px solid #17203314}.row:first-child{border-top:0}.row.me{background:#edf8f1}.row.rank-gold{background:#fff6d8}.row.rank-silver{background:#f0f2f5}.row.rank-bronze{background:#f7eee7}.rank{font-size:2.15rem;font-weight:900;color:#6f798a}.rank-gold .rank{color:#9a7819}.rank-silver .rank{color:#66707d}.rank-bronze .rank{color:#96613f}.entry-meta{display:grid;grid-template-columns:88px minmax(0,1fr);align-items:center;gap:12px;min-width:0;transform:translateX(-1vw)}.mascot-slot{width:88px;height:88px;border-radius:18px;display:grid;place-items:center;border:1px solid #17203314;background:#f3f5f8;overflow:hidden}.mascot-slot img{width:100%;height:100%;object-fit:contain}.name{font-size:1.55rem;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#000}.class{display:block;margin-top:6px;color:#52afe7;font-size:1.1rem;font-weight:850}.achievement-stars{display:grid;grid-template-columns:repeat(3,48px);gap:6px;width:150px;transform:translateX(calc(3vw - 24px))}.achievement-stars img{width:48px;height:48px;object-fit:contain}.achievement-stars img.is-muted{opacity:.22;filter:grayscale(1)}.score{text-align:right;color:#000;font-size:2.15rem;font-weight:900}.row.me .score{color:#248f5b}.note{margin-top:16px;padding:14px 16px;border-radius:16px;background:#ffffff94;color:#172033ad;text-align:left}button{width:min(100%,760px);min-height:58px;margin-top:16px;border:0;border-radius:16px;background:linear-gradient(145deg,#68c9f4,#52afe7);color:#fff;font-size:1.05rem;font-weight:800}.highscore-exit{position:fixed;top:calc(14px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));z-index:10001;width:48px;height:48px;border-radius:50%;border:1px solid #1720331a;background:#fffffff0;color:#172033;font-size:1.35rem;opacity:0;pointer-events:none}.highscore-exit.visible{opacity:1;pointer-events:auto}@media(max-width:700px){main{padding:12px}.card{min-height:95vh;padding:24px 12px;border-radius:24px}.row{grid-template-columns:58px minmax(0,1fr) 96px 108px;gap:6px;min-height:106px;padding:18px 14px}.rank{font-size:1.45rem}.entry-meta{grid-template-columns:62px minmax(0,1fr);gap:8px;transform:translateX(-1vw)}.mascot-slot{width:62px;height:62px;border-radius:14px}.achievement-stars{grid-template-columns:repeat(3,30px);width:96px;gap:2px;transform:translateX(calc(3vw - 16px))}.achievement-stars img{width:30px;height:30px}.name{font-size:1.12rem}.class{font-size:.9rem}.score{font-size:1.5rem}}
</style>
</head>
<body>
<button class="highscore-exit" id="exit" aria-label="Highscoreliste verlassen">×</button>
<main><section class="card"><div class="brand-row"><p class="eyebrow">Einmaleins</p></div><h1>Schulweite Highscoreliste</h1><p class="muted" id="intro">Eine kurze Demo simuliert Spielzeit und Übertragung.</p><div class="timer"><span>Zeit</span><strong id="time">0:10</strong></div><div class="bar"><span id="bar"></span></div><p class="status" id="status">Testspiel läuft …</p><section class="list-shell"><p class="list-heading">Beispielrangliste</p><div id="leaderboard" class="highscore-list" hidden></div></section><div class="note">Die Einträge sind frei erfunden. Klassentier und bis zu drei Errungenschaften werden mit den Originalbildern dargestellt.</div><button id="restart">Demo erneut starten</button></section></main>
<script>
(()=>{const p=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.replace(/^#\??/,""));let stored=null;try{stored=JSON.parse(localStorage.getItem("einmaleins.student.profile.v1")||"null")}catch{}const get=(k,f="")=>p.get(k)||h.get(k)||(stored&&typeof stored[k]==="string"?stored[k]:"")||f,firstName=get("firstName","Schüler"),studentId=get("studentId","demo-student"),groups=get("deviceGroups",""),m=groups.split(/[,;|]/).map(x=>x.trim()).find(x=>/^(M(?:[1-9]|1[0-6])|Lehrer)$/i.test(x)),className=m?m.toUpperCase():(stored&&stored.className?stored.className:"M1"),n=Number(p.get("score")),score=Number.isInteger(n)&&n>=0?n:742,mascots=Object.fromEntries(Array.from({length:16},(_,i)=>[`M${i+1}`,`./M${i+1}.png`])),starAssets=["./Stern1.png","./Stern2.png","./Stern3.png"];mascots.Lehrer="./M1.png";const rows=[{name:"Sophie",className:"M3",score:1288,stars:3},{name:"Lukas",className:"M6",score:1196,stars:2},{name:"Emma",className:"M1",score:1034,stars:3},{name:"Noah",className:"M8",score:987,stars:2},{name:"Mia",className:"M4",score:931,stars:1},{name:"Ben",className:"M2",score:884,stars:2},{name:"Lea",className:"M5",score:816,stars:1},{name:firstName,className,score,studentId,stars:3},{name:"Paul",className:"M7",score:731,stars:1}],$=id=>document.getElementById(id),time=$("time"),bar=$("bar"),status=$("status"),list=$("leaderboard"),intro=$("intro"),restart=$("restart"),exit=$("exit");intro.textContent=`Zehn Sekunden Spielzeit werden simuliert. Danach wird ${firstName} testweise mit ${score} Punkten übertragen.`;const esc=v=>v.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");function starHtml(n){return `<span class="achievement-stars" aria-label="${Math.min(n,3)} von 3 Errungenschaften">${starAssets.map((s,i)=>`<img src="${s}" class="${i<n?"":"is-muted"}" alt="">`).join("")}</span>`}function finish(){const sorted=[...rows].sort((a,b)=>b.score-a.score).map((e,i)=>({...e,rank:i+1})),me=sorted.find(e=>e.studentId===studentId&&e.name===firstName&&e.score===score);status.textContent=`Übertragung simuliert · ${me?`Platz ${me.rank}`:"Eintrag übernommen"}`;status.className="status ok";list.innerHTML=sorted.map(e=>`<div class="row ${e.studentId===studentId?"me":""} ${e.rank===1?"rank-gold":e.rank===2?"rank-silver":e.rank===3?"rank-bronze":""}"><div class="rank">${e.rank}</div><div class="entry-meta"><span class="mascot-slot"><img src="${mascots[e.className]||""}" alt="Klasse ${esc(e.className||"")}"></span><div style="min-width:0"><div class="name">${esc(e.name)}${e.studentId===studentId?" · Du":""}</div><span class="class">Klasse ${esc(e.className||"–")}</span></div></div>${starHtml(e.stars)}<div class="score">${e.score}</div></div>`).join("");list.hidden=false;updateExit()}let timerId=0;function start(){scrollTo(0,0);clearInterval(timerId);list.hidden=true;status.textContent="Testspiel läuft …";status.className="status";time.textContent="0:10";bar.style.width="0%";exit.classList.remove("visible");const t=Date.now();timerId=setInterval(()=>{const rem=Math.max(0,10000-(Date.now()-t));time.textContent=`0:${String(Math.ceil(rem/1000)).padStart(2,"0")}`;bar.style.width=`${Math.min(100,(Date.now()-t)/10000*100)}%`;if(rem<=0){clearInterval(timerId);finish()}},50)}function updateExit(){exit.classList.toggle("visible",scrollY>Math.max(220,innerHeight*.35))}exit.onclick=()=>scrollTo({top:0,behavior:"smooth"});addEventListener("scroll",updateExit,{passive:true});["gesturestart","gesturechange","gestureend"].forEach(t=>document.addEventListener(t,e=>{if(e.cancelable)e.preventDefault()},{passive:false}));restart.onclick=start;start()})()
</script>
</body>
</html>
